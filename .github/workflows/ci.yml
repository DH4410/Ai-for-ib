name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify:private
      - run: npm test
      - run: npm run typecheck
      - run: python3 -m py_compile training/colab_train.py training/benchmark_models.py
      - run: npm run build
